<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek Peak/Off-Peak Widget — mockup v2</title>
<style>
  :root {
    --text: #1f2430; --muted: #6b7280; --card: #ffffff; --border: #e5e7eb;
    --accent: #4D6BFE;
    --good: #16a34a; --bad: #dc2626;
    --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  body.dark { --text: #e7e9f0; --muted: #94a3b8; --card: #161a23; --border: #2a3040; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px; background:#f3f4f6; font-family:var(--font-body); color:var(--text); }
  body.dark { background:#0b0e14; }
  .stage { max-width:360px; margin:0 auto; }
  .ds-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; box-shadow:0 1px 2px rgba(0,0,0,.05); position:relative; }

  /* header */
  .ds-head { display:flex; align-items:center; gap:10px; }
  .ds-logo { width:32px; height:32px; flex:0 0 auto; display:grid; place-items:center; }
  .ds-logo svg { width:100%; height:100%; }
  .ds-title { font-weight:700; font-size:15px; line-height:1.2; }
  .ds-subtitle { font-size:11.5px; color:var(--muted); }

  /* refresh dot — top-right */
  .ds-refresh { position:absolute; top:14px; right:16px; width:10px; height:10px; border-radius:50%; }
  .ds-refresh.red   { background: var(--bad); box-shadow:0 0 0 3px color-mix(in srgb, var(--bad) 18%, transparent); }
  .ds-refresh.green { background: var(--good); box-shadow:0 0 0 3px color-mix(in srgb, var(--good) 18%, transparent); }
  .ds-refresh-label { position:absolute; top:12px; right:30px; font-size:10px; color:var(--muted); }

  .ds-sep { height:1px; background:var(--border); margin:12px 0; }

  .ds-status { display:flex; align-items:baseline; gap:8px; margin-bottom:4px; }
  .ds-pill { font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; padding:3px 9px; border-radius:999px; border:1px solid transparent; }
  .ds-pill.good { color:var(--good); border-color:var(--good); background:color-mix(in srgb, var(--good) 10%, transparent); }
  .ds-pill.bad  { color:var(--bad);  border-color:var(--bad);  background:color-mix(in srgb, var(--bad) 10%, transparent); }
  .ds-count { font-family:var(--font-mono); font-weight:700; font-size:24px; line-height:1; }
  .ds-count.good { color:var(--good); }
  .ds-count.bad  { color:var(--bad); }
  .ds-count-label { font-size:11px; color:var(--muted); margin-top:3px; }

  .ds-table { width:100%; border-collapse:collapse; font-size:11.5px; margin-top:4px; }
  .ds-table th, .ds-table td { text-align:right; padding:5px 4px; }
  .ds-table th:first-child, .ds-table td:first-child { text-align:left; }
  .ds-table thead th { color:var(--muted); font-weight:600; border-bottom:1px solid var(--border); }
  .ds-table tbody td { font-family:var(--font-mono); }
  .ds-table .rowhead { font-family:var(--font-body); font-weight:600; color:var(--text); }
  .ds-table td.off { color:var(--good); } .ds-table td.peak { color:var(--bad); }
  .ds-table td.modelrow { border-top:1px solid var(--border); }

  .ds-banner { margin-top:12px; padding:7px 10px; border-radius:8px; font-size:12px; font-weight:600; color:#fff; background:var(--accent); text-align:center; }

  /* footer with OneWeb O lower-right */
  .ds-foot { margin-top:10px; display:flex; align-items:center; justify-content:space-between; font-size:10.5px; color:var(--muted); }
  .ds-foot .ow-o { width:12px; height:12px; }
  .ds-foot .ow-o svg { width:100%; height:100%; }
</style>
</head>
<body>
<div class="stage">
  <div class="ds-card">

    <!-- refresh dot: red = not yet updated -->
    <span class="ds-refresh red" title="awaiting parameter refresh"></span>

    <!-- header: whale logo -->
    <div class="ds-head">
      <div class="ds-logo">
        REPLACE_WHALE
      </div>
      <div>
        <div class="ds-title">DeepSeek Pricing</div>
        <div class="ds-subtitle">Peak / Off-peak status</div>
      </div>
    </div>

    <div class="ds-sep"></div>

    <!-- off-peak example -->
    <div class="ds-status">
      <span class="ds-pill good">Off-Peak · ½ price</span>
      <span class="ds-count good">02:14</span>
    </div>
    <div class="ds-count-label">until peak pricing (2× cost) · next change 17:00</div>

    <div class="ds-sep"></div>

    <table class="ds-table">
      <thead><tr><th></th><th>In·miss</th><th>Output</th></tr></thead>
      <tbody>
        <tr><td class="rowhead modelrow">deepseek-flash</td><td class="off modelrow">$0.15</td><td class="off modelrow">$0.60</td></tr>
        <tr class="sub"><td></td><td class="peak">$0.30</td><td class="peak">$1.20</td></tr>
        <tr><td class="rowhead modelrow">deepseek-v4-pro</td><td class="off modelrow">$0.66</td><td class="off modelrow">$1.98</td></tr>
        <tr class="sub"><td></td><td class="peak">$1.32</td><td class="peak">$3.96</td></tr>
      </tbody>
    </table>

    <div class="ds-banner" style="background:#e63946">Happy holidays!</div>

    <div class="ds-foot">
      <span>Updated 13:58 · peak = 2× off-peak</span>
      <span class="ow-o">REPLACE_OW</span>
    </div>

  </div>
</div>
</body>
</html>
